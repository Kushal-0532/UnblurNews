[project]
name = "unblur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
]

[dependency-groups]
backend = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "safetensors>=0.8.0",
    "torch>=2.12.1",
    "transformers>=5.12.1",
    "uvicorn[standard]>=0.49.0",
]
corpus = [
    "datasets>=5.0.0",
]
# CI/test deps only: no torch, the analyzer is stubbed in tests/conftest.py
dev = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# imports follow sys.path / env setup on purpose
"backend/main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# ponytail: aligned one-liner style kept as-is; clean up if the file gets touched
"backend/evaluate.py" = ["E701", "E702", "E741"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
